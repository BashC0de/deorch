services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deorch
      POSTGRES_PASSWORD: deorch
      POSTGRES_DB: deorch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deorch -d deorch"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - deorch-network

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deorch-network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://deorch:deorch@postgres:5432/deorch
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      DEORCH_SECRET_KEY: ${DEORCH_SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEORCH_ENV: development
    volumes:
      - ./services/api/src:/app/src:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deorch-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - deorch-network

volumes:
  postgres_data:

networks:
  deorch-network:
    driver: bridge
